name: Bionic APK (experimental)

on:
  push:
    branches: [experimental-bionic]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bionic-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/experimental-bionic'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GOW3_JOBS: '2'
      GOW3_BUILD_TOOLS: '35.0.0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;35.0.0 ndk;29.0.14206865'
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android
      - name: Source and native preparation tests
        run: |
          python -m unittest discover -s tests -p 'test_android_*.py'
          bash tools/android/bionic/build_prepare.sh host
          python -m unittest discover -s tests -p 'test_bionic_*.py'
          python -m compileall -q tools/android/bionic scripts
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" compile --dir android-launcher/app/src/main/res -o "$RUNNER_TEMP/resources.zip"
      - name: Check launcher compilation before building native runtime
        run: bash android-launcher/gradlew -p android-launcher :app:compileReleaseJavaWithJavac -Pgow3Bionic=true --no-daemon --max-workers=2
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          cache-environment: true
          init-shell: bash
      - name: Host headers and native tools
        shell: bash -el {0}
        run: |
          bash ci/setup-deps.sh "$CONDA_PREFIX"
          echo "GOW3_BIONIC_HEADERS=$CONDA_PREFIX" >> "$GITHUB_ENV"
          echo "GOW3_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Build, package, sign and validate experimental APK
        shell: bash -el {0}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          bash tools/android/bionic/build_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Daedalus-Fork-Bionic-Experimental-arm64
          path: |
            out/release/God-of-War-III-*-Bionic-Experimental.apk
            out/release/God-of-War-III-*-Bionic-Experimental.apk.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Bionic-build-diagnostics
          path: |
            .local-deps/android/bionic-build/**/*.log
            android-launcher/app/build/outputs/logs/
          if-no-files-found: ignore
